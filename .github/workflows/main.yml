# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, bbbmodfork]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildWindows:
    runs-on: windows-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      - name: Install Haxelib
        run: |
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp bfe01edc20cdc54fe7f54f1f2124b8959646144c
          haxelib --always --quiet git grig.audio https://gitlab.com/haxe-grig/grig.audio.git
          haxelib --always --quiet install flixel 5.6.2 --skip-dependencies
          haxelib git openfl https://github.com/FunkinCrew/openfl a85b45f21c7e1a4c19663a193bf4ea961faf0dfa
          haxelib git lime https://github.com/FunkinCrew/lime 6421de16b9dfa4fb55c19f12db65d392a57585c8'
          cd .haxelib/lime/git/
          git submodule update
          cd ../../../
          haxelib run lime rebuild cpp -clean
          haxelib --always --quiet install flixel-ui 2.6.2
          haxelib --always --quiet install flixel-addons 3.3.2
          haxelib --always --quiet git hscript https://github.com/nebulazorua/t-hscript
          haxelib --always --quiet install flxanimate 3.0.4
          haxelib --always --quiet install hxdiscord_rpc 1.1.1
          haxelib --always --quiet git linc_luajit https://github.com/riconuts/linc_luajit
          haxelib --always --quiet install moonchart 0.4.0
          haxelib --always --quiet git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib --always --quiet install hxvlc 2.2.6 --skip-dependencies
          haxelib git funkin.vis https://github.com/nebulazorua/trollVis.git
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git
        shell: cmd
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build windows
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin
      # Thank you codename engine I will be stealing from you in the future!!
      # /j
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-windows") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Uploading new cache
        uses: actions/cache@v3
        with:
          # caching again since for some reason it doesnt work with the first post cache shit
          key: cache-build-windows
          path: |
            .haxelib/
            export/release/windows/haxe/
            export/release/windows/obj/
          restore-keys: |
            cache-build-windows
  
  buildLinux:
    # The type of runner that the job will run on
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        build: [release]
        version: [20.04, 22.04]
    timeout-minutes: 45

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          sudo apt install libxrandr-dev
          haxelib setup ~/haxelib
          haxelib --always --quiet git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib --always --quiet git grig.audio https://gitlab.com/haxe-grig/grig.audio.git
          haxelib --always --quiet install flixel 5.6.2
          haxelib --always --quiet git lime https://github.com/swordcubes-grave-of-shite/lime
          haxelib --always --quiet git openfl https://github.com/swordcubes-grave-of-shite/openfl
          haxelib --always --quiet install flixel-ui 2.6.2
          haxelib --always --quiet install flixel-addons 3.3.2
          haxelib --always --quiet git hscript https://github.com/nebulazorua/t-hscript
          haxelib --always --quiet install hxvlc 1.6.1
          haxelib --always --quiet install hxdiscord_rpc 1.1.1
          haxelib --always --quiet git linc_luajit https://github.com/riconuts/linc_luajit
          haxelib --always --quiet install moonchart 0.4.0
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build Project.xml linux -Dartifact --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildUbuntu${{ matrix.version }}-32-${{ matrix.build }}
          path: 'export/${{ matrix.build }}/linux/bin'
  
  buildMac:
    runs-on: macos-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        build: [release]
        version: [13]
    timeout-minutes: 45
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib --always --quiet git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib --always --quiet git grig.audio https://gitlab.com/haxe-grig/grig.audio.git
          haxelib --always --quiet install flixel 5.6.2
          haxelib --always --quiet git lime https://github.com/swordcubes-grave-of-shite/lime
          haxelib --always --quiet git openfl https://github.com/swordcubes-grave-of-shite/openfl
          haxelib --always --quiet install flixel-ui 2.6.2
          haxelib --always --quiet install flixel-addons 3.3.2
          haxelib --always --quiet git hscript https://github.com/nebulazorua/t-hscript
          haxelib --always --quiet install hxvlc 1.6.1
          haxelib --always --quiet install hxdiscord_rpc 1.1.1
          haxelib --always --quiet git linc_luajit https://github.com/riconuts/linc_luajit
          haxelib --always --quiet install moonchart 0.4.0
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build mac -Dartifact --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildMac-${{ matrix.version }}-64-${{ matrix.build }}
          path: 'export/${{ matrix.build }}/macos/bin'
